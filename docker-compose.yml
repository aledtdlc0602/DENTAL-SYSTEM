# Base de datos local opcional (si no usa Neon / Railway).
#   npm run db:up      -> levanta PostgreSQL 16 en localhost:5432
#   DATABASE_URL="postgresql://sigo:sigo@localhost:5432/sigo_dental"
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sigo
      POSTGRES_PASSWORD: sigo
      POSTGRES_DB: sigo_dental
    ports:
      - "5432:5432"
    volumes:
      - sigo_pg:/var/lib/postgresql/data
volumes:
  sigo_pg:
